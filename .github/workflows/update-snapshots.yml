name: Atualizar baselines visuais (Linux)

on:
  workflow_dispatch:

jobs:
  update-snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/visual --update-snapshots

      - uses: actions/upload-artifact@v4
        with:
          name: baselines-linux
          path: tests/visual/__screenshots__/**/*-linux.png
          retention-days: 14
